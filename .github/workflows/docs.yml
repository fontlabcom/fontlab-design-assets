name: Build & Deploy Docs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src_docs/requirements.txt

      - name: Check asset inventory
        run: |
          set -euo pipefail
          for pack in \
            fontlab-banners \
            fontlab-marketingpack-company \
            fontlab-marketingpack-fontlab-8 \
            fontlab-marketingpack-transtype-4; do
            dir="src_docs/assets/$pack"
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::asset pack '$pack' is missing or empty"
              exit 1
            fi
            echo "$pack: $count files"
          done

      - name: Build site
        run: python build.py build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
